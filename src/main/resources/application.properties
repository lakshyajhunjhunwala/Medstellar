# Server Configuration (Render injects $PORT dynamically, default to 8081 for local)
server.port=${PORT:8081}

# Database Configuration
# In production (Render), set SPRING_DATASOURCE_URL or DATABASE_URL
# Fallback to local MySQL if no environment variables are specified
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/techwizards_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Lakshya@98}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
